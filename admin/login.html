<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, #0f172a, #1d4ed8);
      color: #0f172a;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.4);
    }
    h1 { font-size: 24px; margin-bottom: 6px; color: #0f172a; }
    .hint { color: #475569; font-size: 14px; margin-bottom: 18px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #334155; font-weight: 600; }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .message {
      margin-top: 12px;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 12px;
      display: none;
    }
    .message.show { display: block; }
    .message.error { background: #fee2e2; color: #b91c1c; }
    .message.success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Sign In</h1>
    <p class="hint">Dùng tài khoản có quyền admin để vào trang quản trị.</p>
    <form id="adminLoginForm">
      <div class="field">
        <label for="identifier">Username or Email</label>
        <input id="identifier" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="8" required />
      </div>
      <button type="submit">Login Admin</button>
    </form>
    <div id="message" class="message"></div>
  </div>
  <script src="/admin/login.js"></script>
</body>
</html>
