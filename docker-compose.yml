version: '3.8'

services:
  app:
    build: .
    container_name: rate-limiting-api
    command: node server.js
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      - redis
      - postgres
      - mongodb
    networks:
      - rate-limiting-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rate-limiting-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - rate-limiting-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: rate-limiting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rate-limiting-network
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: rate-limiting-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rate-limiting-network
    restart: unless-stopped

  # Optional: PgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4
    container_name: rate-limiting-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - rate-limiting-network
    restart: unless-stopped

  # Optional: MongoDB Express for MongoDB management
  mongo-express:
    image: mongo-express
    container_name: rate-limiting-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - rate-limiting-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  mongodb_data:

networks:
  rate-limiting-network:
    driver: bridge